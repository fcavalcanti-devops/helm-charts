application:
  replicas: 2
  image:
    name: felipecs8/conversor-temperatura
    tag: homolog
  service:
    type: ClusterIP
  # Canary (Argo Rollouts): % de pods novos + pausas
  canary:
    steps:
      - setWeight: 50
      - pause:
          duration: 60s
      - setWeight: 100
  clusterIssuer: "letsencrypt-prod"
  ingress:
    enabled: false
    hosts:
    - conversor-temp.127.0.0.1.nip.io
    ingressClassName: null
    tls:
      enabled: false
    sslRedirect:
      enabled: false
